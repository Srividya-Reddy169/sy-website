<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Syam ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<div class="particles" id="particles"></div>

<div class="home-page">

    <div class="home-content">

        <p class="little-text">
            A LITTLE SOMETHING FROM YOUR FAMILY
        </p>

        <h1>Syam</h1>

        <div class="line"></div>

        <p class="home-description">
            Some people don't need a special occasion
            to be celebrated.
            <br><br>
            Sometimes, a simple reminder of how much
            someone means to us is enough. ❤️
        </p>

        <a href="about.html" class="main-button">
            Discover Your Surprise
            <span>→</span>
        </a>

    </div>

    <div class="bottom-text">
        ✦ SOMETHING SPECIAL AWAITS YOU ✦
    </div>

</div>

<script>

const particles = document.getElementById("particles");

for(let i = 0; i < 50; i++){

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";

    particle.style.animationDuration =
        5 + Math.random() * 8 + "s";

    particle.style.animationDelay =
        Math.random() * 5 + "s";

    const size = 2 + Math.random() * 5;

    particle.style.width = size + "px";
    particle.style.height = size + "px";

    particles.appendChild(particle);
}

</script>

</body>
</html>
